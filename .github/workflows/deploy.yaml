name: Sausage Store Deploy

on:
  push:
    branches:
      - main

env:
  NEXUS_HELM_REPO: ${{ secrets.NEXUS_HELM_REPO }}
  NEXUS_HELM_REPO_USER: ${{ secrets.NEXUS_HELM_REPO_USER }}
  NEXUS_HELM_REPO_PASSWORD: ${{ secrets.NEXUS_HELM_REPO_PASSWORD }}
  SAUSAGE_STORE_NAMESPACE: ${{ secrets.SAUSAGE_STORE_NAMESPACE }}
  KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
  VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}

jobs:
  # Сборка и пуш образов в докерхаб:
  build_and_push_to_docker_hub:
      name: Push Docker image to DockerHub
      runs-on: ubuntu-latest
      steps:
        - name: Check out the repo
          # Получение исходного кода из репозитория:
          uses: actions/checkout@v3
        - name: Set up Docker Buildx
          # Установка сборщика контейнеров Docker:
          uses: docker/setup-buildx-action@v2
        - name: Login to Docker 
          # Авторизация на Docker Hub:
          uses: docker/login-action@v2
          # При помощи with передаём в action параметры username и password:
          with:
            username: ${{ secrets.DOCKER_USER }}
            password: ${{ secrets.DOCKER_PASSWORD }}
            # Хорошо ли держать логин и пароль прямо в коде workflow?
            # Нет, это нехорошо. Хранить пароль надо в Secrets.
        - name: Push Backend to DockerHub
          # Одновременный билд и пуш образа в Docker Hub:
          uses: docker/build-push-action@v4
          with:
            # Параметр context: ./backend/ указывает, что нужный Dockerfile 
            # находится в ./backend/
            context: ./backend/
            # Параметр push: true указывает, что образ нужно не только собрать,
            # но и отправить на Docker Hub:
            push: true
            # В параметре tags задаётся название и тег для образа.
            # Для каждого пересобранного образа 
            # устанавливаем тег latest, чтобы потом
            # на сервере и в docker-compose.yml не указывать версию образа:
            tags: alexeybobrov/sausage-backend:latest
            build-args: |
              VERSION=${{ github.sha }}
        - name: Push Frontend to DockerHub
          uses: docker/build-push-action@v4
          with:
            context: ./frontend/
            push: true
            tags: alexeybobrov/sausage-frontend:latest
        - name: Push Backend-report to DockerHub
          uses: docker/build-push-action@v4
          with:
            context: ./backend-report/
            push: true
            tags: alexeybobrov/sausage-backend-report:latest
  # Упаковываем helm-чарт и пушим его в Nexus
  add_helm_chart_to_nexus:
      name: Add Helm Chart To Nexus
      runs-on: ubuntu-latest
      needs: build_and_push_to_docker_hub

      steps:
        - name: Check out the repo
          # Получение исходного кода из репозитория:
          uses: actions/checkout@v3

        - name: Set up Helm
          # Установка утилиты helm и подключение плагина helm-push
          # для публикации чартов в HTTP-репозиторий Nexus:
          uses: azure/setup-helm@v3
          with:
            version: v3.12.0

        - name: Install Helm Push Plugin
          # Установка плагина cm-push (helm-push), который позволяет
          # отправлять собранные чарты в репозиторий Nexus через HTTP:
          run: helm plugin install https://github.com/chartmuseum/helm-push.git

        - name: Package Helm Chart
          # Упаковываем каталог sausage-store-chart в архив .tgz.
          # Пакет кладётся в каталог ./chart-archive,
          # а имя архива формируется из имени и версии чарта из Chart.yaml:
          run: |
            mkdir -p chart-archive
            helm package sausage-store-chart --destination ./chart-archive

        - name: Add Nexus as Helm Repository
          # Регистрируем репозиторий Nexus локально, чтобы можно было
          # публиковать чарты под именем nexus. Авторизация выполняется
          # по логину/паролю из Secrets:
          run: |
            helm repo add nexus "${{ env.NEXUS_HELM_REPO }}" \
              --username "${{ env.NEXUS_HELM_REPO_USER }}" \
              --password "${{ env.NEXUS_HELM_REPO_PASSWORD }}"

        - name: Push Helm Chart to Nexus
          # Публикуем все упакованные .tgz-чарты из ./chart-archive
          # в репозиторий nexus командой cm-push:
          run: |
            helm cm-push ./chart-archive/*.tgz nexus

  # Деплоим приложения в кластер Kubernetes с помощью helm-чарт
  deploy_helm_chart_to_kubernetes:
      name: Deploy Helm Chart To Kubernetes
      runs-on: ubuntu-latest
      needs: add_helm_chart_to_nexus

      steps:
        - name: Check out the repo
          # Получение исходного кода из репозитория:
          uses: actions/checkout@v3

        - name: Set up Helm
          # Установка утилиты helm:
          uses: azure/setup-helm@v3
          with:
            version: v3.12.0

        - name: Set up kubectl
          # Установка клиента kubectl для работы с кластером Kubernetes:
          uses: azure/setup-kubectl@v3

        - name: Add Nexus as Helm Repository
          # Регистрируем репозиторий Nexus локально и обновляем индекс чартов.
          # Это позволяет установить чарт, опубликованный на предыдущем шаге:
          run: |
            helm repo add nexus "${{ env.NEXUS_HELM_REPO }}" \
              --username "${{ env.NEXUS_HELM_REPO_USER }}" \
              --password "${{ env.NEXUS_HELM_REPO_PASSWORD }}"
            helm repo update

        - name: Setup Kubeconfig
          # Подключаем kubeconfig из Secrets, чтобы helm/kubectl могли
          # подключиться к кластеру и деплоить в наш namespace:
          run: |
            mkdir -p "$HOME/.kube"
            echo "${{ env.KUBE_CONFIG }}" | base64 --decode > "$HOME/.kube/config"

        - name: Deploy Helm Chart To Kubernetes
          # Устанавливаем/обновляем чарт sausage-store из репозитория nexus
          # в наш namespace с помощью helm upgrade.
          # Команда --install создаёт релиз, если он ещё не существует,
          # а --wait дожидается готовности развёрнутых ресурсов:
          run: |
            helm upgrade sausage-store nexus/sausage-store \
              --namespace "${{ env.SAUSAGE_STORE_NAMESPACE }}" \
              --install --wait
