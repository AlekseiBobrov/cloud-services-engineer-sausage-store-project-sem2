---
# ConfigMap со скриптом создания базы и пользователя для отчётного сервиса.
# Создаётся как hook-ресурс ДО Job (weight 4 < 5).
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-report-init
  annotations:
    "helm.sh/hook": "post-install,post-upgrade"
    "helm.sh/hook-weight": "4"
data:
  create-report-user.js: |
    // Подключаемся как root и создаём базу с пользователем для отчётов
    const admin = db.getSiblingDB("admin");
    admin.auth(
      process.env.MONGO_INITDB_ROOT_USERNAME,
      process.env.MONGO_INITDB_ROOT_PASSWORD
    );

    const reportDb = db.getSiblingDB(process.env.REPORT_DB);

    if (reportDb.getUser(process.env.REPORT_USER) == null) {
      reportDb.createUser({
        user: process.env.REPORT_USER,
        pwd: process.env.REPORT_PASSWORD,
        roles: [{ role: "readWrite", db: process.env.REPORT_DB }],
      });
      print("Created report user: " + process.env.REPORT_USER + " on db: " + process.env.REPORT_DB);
    } else {
      print("Report user already exists: " + process.env.REPORT_USER);
    }
---
# Job создаёт базу и пользователя для отчётного сервиса в MongoDB.
# Выполняется после установки chart (post-install) и ПОСЛЕ запуска MongoDB
# (StatefulSet имеет helm.sh/hook-weight "-5", а Job — "5").
apiVersion: batch/v1
kind: Job
metadata:
  name: mongodb-report-init
  annotations:
    "helm.sh/hook": "post-install,post-upgrade"
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": "hook-succeeded,before-hook-creation"
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      name: mongodb-report-init
    spec:
      restartPolicy: OnFailure
      containers:
      - name: mongosh
        image: mongo:7.0
        command: ["/bin/sh", "-c"]
        args:
          - |
            echo "Waiting for MongoDB to become ready..."
            until mongosh "mongodb://mongodb:{{ .Values.mongodb.containerPort }}/admin?authSource=admin" --quiet /scripts/create-report-user.js; do
              echo "MongoDB not ready yet (or auth failed), retrying in 5s..."
              sleep 5
            done
            echo "MongoDB report user ensured."
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        envFrom:
          - configMapRef:
              name: mongodb-conf
        env:
          - name: REPORT_DB
            value: {{ .Values.mongodb.report.db | quote }}
          - name: REPORT_USER
            value: {{ .Values.mongodb.report.username | quote }}
          - name: REPORT_PASSWORD
            value: {{ .Values.mongodb.report.password | quote }}
        volumeMounts:
        - name: scripts
          mountPath: /scripts
      volumes:
      - name: scripts
        configMap:
          name: mongodb-report-init