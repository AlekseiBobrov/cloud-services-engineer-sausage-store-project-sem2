# DNS-резолвер для динамического разрешения upstream'а на этапе запроса.
# 127.0.0.11 — встроенный DNS Docker (для кластера замените на адрес CoreDNS).
resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        # Переменная не позволяет nginx резолвить хост при старте —
        # иначе контейнер падал бы без доступного backend-service
        set $backend_uri "http://backend-service:8080";
        proxy_pass $backend_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Кэширование статики с content-hash по именам файлов
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}